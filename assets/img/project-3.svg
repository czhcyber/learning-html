<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="p3-title">
  <title id="p3-title">Preview of the Film Log project: a responsive grid of photo thumbnails</title>
  <!-- Original illustration drawn for this site. -->
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fb"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <clipPath id="p3frame1"><rect x="62" y="72" width="88" height="62" rx="6"/></clipPath>
    <clipPath id="p3frame2"><rect x="166" y="72" width="88" height="62" rx="6"/></clipPath>
    <clipPath id="p3frame3"><rect x="270" y="72" width="88" height="62" rx="6"/></clipPath>
    <clipPath id="p3frame4"><rect x="374" y="72" width="44" height="62" rx="6"/></clipPath>
  </defs>

  <rect width="480" height="300" fill="url(#p3bg)"/>
  <rect x="40" y="34" width="400" height="232" rx="14" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>

  <!-- header -->
  <rect x="62" y="50" width="76" height="9" rx="4.5" fill="#14161c"/>
  <rect x="356" y="48" width="62" height="14" rx="7" fill="#e8edff"/>

  <!-- thumbnail 1: mountains -->
  <g>
    <rect x="62" y="72" width="88" height="62" rx="6" fill="#cfe3ff"/>
    <g clip-path="url(#p3frame1)">
      <circle cx="128" cy="88" r="8" fill="#ffd166"/>
      <path d="M62 134l26-30 18 20 14-14 30 24Z" fill="#2f5bff"/>
    </g>
  </g>

  <!-- thumbnail 2: city -->
  <g>
    <rect x="166" y="72" width="88" height="62" rx="6" fill="#e8edff"/>
    <g clip-path="url(#p3frame2)">
      <rect x="176" y="96" width="14" height="38" fill="#7a4dff"/>
      <rect x="194" y="84" width="16" height="50" fill="#2f5bff"/>
      <rect x="214" y="106" width="12" height="28" fill="#7a4dff"/>
      <rect x="230" y="92" width="16" height="42" fill="#2f5bff"/>
    </g>
  </g>

  <!-- thumbnail 3: portrait silhouette -->
  <g>
    <rect x="270" y="72" width="88" height="62" rx="6" fill="#ffe6d1"/>
    <g clip-path="url(#p3frame3)">
      <circle cx="314" cy="94" r="12" fill="#e8b48c"/>
      <path d="M292 134c0-16 10-26 22-26s22 10 22 26Z" fill="#2f5bff"/>
    </g>
  </g>

  <!-- thumbnail 4 (partly cut off, suggesting a wider grid) -->
  <g>
    <rect x="374" y="72" width="44" height="62" rx="6" fill="#d8f0e2"/>
    <g clip-path="url(#p3frame4)">
      <path d="M374 122c10-12 16-6 24-14s14-4 20 2v24h-44Z" fill="#3fbf7f"/>
    </g>
  </g>

  <!-- caption lines under each thumbnail -->
  <g fill="#dfe3ed">
    <rect x="62" y="142" width="56" height="7" rx="3.5"/>
    <rect x="62" y="154" width="34" height="6" rx="3"/>

    <rect x="166" y="142" width="56" height="7" rx="3.5"/>
    <rect x="166" y="154" width="40" height="6" rx="3"/>

    <rect x="270" y="142" width="56" height="7" rx="3.5"/>
    <rect x="270" y="154" width="28" height="6" rx="3"/>

    <rect x="374" y="142" width="44" height="7" rx="3.5"/>
    <rect x="374" y="154" width="30" height="6" rx="3"/>
  </g>

  <!-- second row: filter chips acting as a layout hint -->
  <g>
    <rect x="62" y="182" width="52" height="18" rx="9" fill="#2f5bff"/>
    <rect x="122" y="182" width="52" height="18" rx="9" fill="#eef1f8"/>
    <rect x="182" y="182" width="52" height="18" rx="9" fill="#eef1f8"/>
    <rect x="242" y="182" width="52" height="18" rx="9" fill="#eef1f8"/>
  </g>

  <!-- grid guide lines, hinting at CSS Grid -->
  <g stroke="#eef1f8" stroke-width="2" stroke-dasharray="6 6">
    <line x1="40" y1="222" x2="440" y2="222"/>
    <line x1="40" y1="252" x2="440" y2="252"/>
  </g>
  <rect x="62" y="230" width="120" height="14" rx="7" fill="#eef1f8"/>
</svg>
