<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img"
     aria-labelledby="portrait-title portrait-desc">
  <title id="portrait-title">Illustrated portrait of a person wearing headphones</title>
  <desc id="portrait-desc">A flat, stylised portrait: a person with headphones on, over a striped background.</desc>

  <!-- Original illustration drawn by hand for this site. Not a photograph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edff"/>
      <stop offset="1" stop-color="#f2e9ff"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="360" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="360" height="360" fill="url(#bg)"/>

    <!-- background stripes -->
    <g opacity=".5">
      <rect x="-40" y="44" width="440" height="12" rx="6" fill="#ffffff" transform="rotate(-8 180 50)"/>
      <rect x="-40" y="86" width="440" height="12" rx="6" fill="#ffffff" transform="rotate(-8 180 92)"/>
      <rect x="-40" y="128" width="440" height="12" rx="6" fill="#ffffff" transform="rotate(-8 180 134)"/>
    </g>

    <!-- shoulders -->
    <path d="M62 360c0-62 53-104 118-104s118 42 118 104Z" fill="#2f5bff"/>
    <path d="M180 256c22 0 42 4 60 12l-60 92-60-92c18-8 38-12 60-12Z" fill="#ffffff" opacity=".22"/>

    <!-- neck -->
    <rect x="158" y="214" width="44" height="56" rx="18" fill="#e8b48c"/>

    <!-- head -->
    <ellipse cx="180" cy="160" rx="66" ry="74" fill="#f2c39c"/>

    <!-- hair -->
    <path d="M114 152c0-42 30-70 66-70s66 28 66 70c0 6-2 10-4 10-4-26-24-38-62-38s-58 12-62 38c-2 0-4-4-4-10Z" fill="#2b3040"/>
    <path d="M114 150c-6 4-8 14-6 22 2-10 6-16 6-22Z" fill="#2b3040"/>
    <path d="M246 150c6 4 8 14 6 22-2-10-6-16-6-22Z" fill="#2b3040"/>

    <!-- headphones -->
    <path d="M104 162c0-46 34-82 76-82s76 36 76 82" fill="none" stroke="#14161c" stroke-width="12" stroke-linecap="round"/>
    <rect x="88" y="152" width="30" height="52" rx="14" fill="#14161c"/>
    <rect x="242" y="152" width="30" height="52" rx="14" fill="#14161c"/>
    <rect x="94" y="160" width="18" height="36" rx="9" fill="#7a4dff"/>
    <rect x="248" y="160" width="18" height="36" rx="9" fill="#7a4dff"/>

    <!-- eyes: simple arcs, closed and calm -->
    <path d="M152 160c6-8 16-8 22 0" fill="none" stroke="#2b3040" stroke-width="5" stroke-linecap="round"/>
    <path d="M186 160c6-8 16-8 22 0" fill="none" stroke="#2b3040" stroke-width="5" stroke-linecap="round"/>

    <!-- smile -->
    <path d="M166 194c8 10 22 10 30 0" fill="none" stroke="#2b3040" stroke-width="5" stroke-linecap="round"/>

    <!-- cheeks -->
    <ellipse cx="140" cy="182" rx="10" ry="6" fill="#eb9f8c" opacity=".5"/>
    <ellipse cx="222" cy="182" rx="10" ry="6" fill="#eb9f8c" opacity=".5"/>

    <!-- cable -->
    <path d="M256 204c26 18 30 44 14 66" fill="none" stroke="#14161c" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
