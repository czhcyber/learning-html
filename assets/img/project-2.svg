<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="p2-title">
  <title id="p2-title">Preview of the Card Game project: fanned playing cards on a table</title>
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fb"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="p2card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#p2bg)"/>

  <!-- white panel -->
  <rect x="40" y="34" width="400" height="232" rx="14" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>

  <!-- header -->
  <rect x="62" y="50" width="76" height="9" rx="4.5" fill="#14161c"/>
  <rect x="356" y="48" width="62" height="14" rx="7" fill="#e8edff"/>

  <!-- ===== FANNED CARDS ===== -->

  <!-- card 1 (leftmost, tilted left) -->
  <g transform="translate(110 190) rotate(-18)">
    <rect x="0" y="-70" width="56" height="84" rx="6" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>
    <rect x="6" y="-62" width="12" height="16" rx="2" fill="#7a4dff"/>
    <circle cx="28" cy="-28" r="14" fill="url(#p2card1)" opacity="0.15"/>
  </g>

  <!-- card 2 (center-left, slightly tilted) -->
  <g transform="translate(180 194) rotate(-6)">
    <rect x="0" y="-70" width="56" height="84" rx="6" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>
    <rect x="6" y="-62" width="12" height="16" rx="2" fill="#ffd166"/>
    <circle cx="28" cy="-28" r="14" fill="#ffd166" opacity="0.15"/>
  </g>

  <!-- card 3 (center, straight, highlighted) -->
  <g transform="translate(250 196)">
    <rect x="0" y="-70" width="56" height="84" rx="6" fill="#fff" stroke="#2f5bff" stroke-width="2.5"/>
    <rect x="6" y="-62" width="12" height="16" rx="2" fill="#2f5bff"/>
    <circle cx="28" cy="-28" r="16" fill="url(#p2card1)" opacity="0.18"/>
    <!-- suit shape: diamond -->
    <polygon points="28,-38 36,-28 28,-18 20,-28" fill="#2f5bff"/>
  </g>

  <!-- card 4 (center-right, slightly tilted) -->
  <g transform="translate(320 194) rotate(6)">
    <rect x="0" y="-70" width="56" height="84" rx="6" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>
    <rect x="6" y="-62" width="12" height="16" rx="2" fill="#2f5bff"/>
    <circle cx="28" cy="-28" r="14" fill="url(#p2card1)" opacity="0.15"/>
  </g>

  <!-- card 5 (rightmost, tilted right) -->
  <g transform="translate(388 190) rotate(18)">
    <rect x="0" y="-70" width="56" height="84" rx="6" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>
    <rect x="6" y="-62" width="12" height="16" rx="2" fill="#7a4dff"/>
    <circle cx="28" cy="-28" r="14" fill="url(#p2card1)" opacity="0.15"/>
  </g>

  </svg>