<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="p4-title">
  <title id="p4-title">Preview of the Useless Machine project: a box that turns itself off</title>
  <defs>
    <linearGradient id="p4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fb"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="p4arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#p4bg)"/>

  <!-- white panel -->
  <rect x="40" y="34" width="400" height="232" rx="14" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>

  <!-- header -->
  <rect x="62" y="50" width="76" height="9" rx="4.5" fill="#14161c"/>
  <rect x="356" y="48" width="62" height="14" rx="7" fill="#e8edff"/>

  <!-- ===== USELESS MACHINE ===== -->

  <!-- box body -->
  <rect x="130" y="86" width="220" height="120" rx="12" fill="#fff" stroke="#dfe3ed" stroke-width="2"/>

  <!-- toggle switch: base -->
  <rect x="222" y="62" width="36" height="14" rx="4" fill="#5b6273"/>
  <!-- toggle lever (flipped forward / ON position) -->
  <rect x="234" y="34" width="12" height="30" rx="5" fill="#2f5bff"/>

  <!-- door opening on front face -->
  <rect x="150" y="108" width="80" height="70" rx="8" fill="#14161c" opacity="0.82"/>

  <!-- mechanical arm -->
  <!-- motor base inside the box -->
  <rect x="168" y="174" width="18" height="16" rx="4" fill="#5b6273"/>

  <!-- lower arm (vertical) -->
  <rect x="175" y="130" width="10" height="46" rx="5" fill="url(#p4arm)"/>

  <!-- elbow joint -->
  <circle cx="180" cy="128" r="7" fill="#2f5bff"/>

  <!-- upper arm reaching diagonally toward the switch -->
  <rect x="180" y="58" width="9" height="72" rx="4.5" fill="url(#p4arm)" transform="rotate(-48 184 58)"/>

  <!-- hand / finger tip touching the lever -->
  <circle cx="240" cy="38" r="5" fill="#7a4dff"/>
</svg>