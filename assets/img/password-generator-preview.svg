<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="password-gen-title">
  <title id="password-gen-title">Preview of Password Generator with dark theme and strength meter</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#bg2)"/>

  <g transform="translate(40, 30)">
    <rect width="400" height="240" rx="24" fill="url(#cardBg2)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Title -->
    <text x="200" y="45" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif"
          font-size="26" font-weight="700" fill="url(#accentGrad)">🔐 Password Generator</text>

    <!-- Password display -->
    <rect x="40" y="65" width="320" height="50" rx="12" fill="rgba(255,255,255,0.08)"
          stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="200" y="96" text-anchor="middle" font-family="'Courier New', monospace"
          font-size="18" font-weight="600" letter-spacing="2" fill="#4ecdc4">Kx9#mP$vL2@nQ7zR</text>

    <!-- Action buttons -->
    <rect x="40" y="125" width="155" height="32" rx="16" fill="rgba(78,205,196,0.15)"/>
    <text x="117" y="146" text-anchor="middle" font-family="sans-serif"
          font-size="13" font-weight="600" fill="#4ecdc4">📋 Copy</text>

    <rect x="205" y="125" width="155" height="32" rx="16" fill="rgba(102,126,234,0.15)"/>
    <text x="282" y="146" text-anchor="middle" font-family="sans-serif"
          font-size="13" font-weight="600" fill="#667eea">🔄 Generate</text>

    <!-- Options section -->
    <text x="60" y="185" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Length: 16</text>

    <!-- Toggle switches (simplified as small circles) -->
    <circle cx="140" cy="181" r="8" fill="url(#accentGrad)"/>
    <circle cx="170" cy="181" r="8" fill="url(#accentGrad)"/>
    <circle cx="200" cy="181" r="8" fill="url(#accentGrad)"/>
    <circle cx="230" cy="181" r="8" fill="url(#accentGrad)"/>

    <text x="250" y="185" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">A-Z a-z 0-9 !@#</text>

    <!-- Strength meter -->
    <rect x="40" y="200" width="320" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="40" y="200" width="320" height="8" rx="4" fill="url(#accentGrad)" opacity="0.9"/>

    <text x="200" y="228" text-anchor="middle" font-family="sans-serif"
          font-size="14" font-weight="700" fill="#4ecdc4">Strong 💪</text>
  </g>
</svg>