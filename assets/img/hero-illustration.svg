<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img"
     aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A desk with a laptop showing a web page layout</title>
  <desc id="hero-desc">A flat illustration of a desk: a laptop displaying a page wireframe, a mug, a plant and sticky notes.</desc>

  <!-- Original illustration drawn by hand for this site. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edff"/>
      <stop offset="1" stop-color="#f6f7fb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect width="560" height="420" rx="22" fill="url(#wall)"/>

  <!-- window -->
  <g opacity=".85">
    <rect x="392" y="34" width="132" height="104" rx="10" fill="#fff" stroke="#c9d3ea" stroke-width="3"/>
    <line x1="458" y1="34" x2="458" y2="138" stroke="#c9d3ea" stroke-width="3"/>
    <line x1="392" y1="86" x2="524" y2="86" stroke="#c9d3ea" stroke-width="3"/>
  </g>

  <!-- hanging plant -->
  <g>
    <path d="M96 24c0 34 6 54 6 78" stroke="#8fb39a" stroke-width="3" fill="none"/>
    <ellipse cx="96" cy="16" rx="26" ry="10" fill="#c98a5e"/>
    <path d="M78 18c-10 34-14 58-6 82" stroke="#4f9f6a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M112 18c12 30 18 56 8 80" stroke="#3fbf7f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M96 20c2 30 0 56-4 76" stroke="#4f9f6a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- desk -->
  <rect x="0" y="286" width="560" height="18" rx="9" fill="#c98a5e"/>
  <rect x="0" y="300" width="560" height="120" fill="#e7d6c6" opacity=".55"/>

  <!-- laptop -->
  <g>
    <!-- screen -->
    <rect x="146" y="112" width="272" height="162" rx="12" fill="#14161c"/>
    <rect x="156" y="122" width="252" height="142" rx="8" fill="#ffffff"/>

    <!-- page wireframe: header bar -->
    <rect x="168" y="134" width="228" height="14" rx="7" fill="url(#screen)"/>
    <circle cx="384" cy="141" r="5" fill="#ffffff" opacity=".8"/>
    <circle cx="368" cy="141" r="5" fill="#ffffff" opacity=".6"/>

    <!-- page wireframe: hero block -->
    <rect x="168" y="158" width="112" height="10" rx="5" fill="#2b3040"/>
    <rect x="168" y="174" width="150" height="7" rx="3.5" fill="#c9d3ea"/>
    <rect x="168" y="186" width="130" height="7" rx="3.5" fill="#c9d3ea"/>
    <rect x="168" y="202" width="62" height="16" rx="8" fill="#2f5bff"/>
    <rect x="292" y="158" width="104" height="60" rx="8" fill="#e8edff" stroke="#c9d3ea" stroke-width="2"/>

    <!-- page wireframe: three cards -->
    <rect x="168" y="232" width="70" height="22" rx="6" fill="#eef1f8" stroke="#dfe3ed" stroke-width="2"/>
    <rect x="246" y="232" width="70" height="22" rx="6" fill="#eef1f8" stroke="#dfe3ed" stroke-width="2"/>
    <rect x="324" y="232" width="70" height="22" rx="6" fill="#eef1f8" stroke="#dfe3ed" stroke-width="2"/>

    <!-- base -->
    <rect x="120" y="274" width="324" height="12" rx="6" fill="#2b3040"/>
    <rect x="248" y="268" width="68" height="8" rx="4" fill="#3a4152"/>
  </g>

  <!-- mug -->
  <g>
    <rect x="432" y="248" width="46" height="40" rx="8" fill="#ffffff" stroke="#c9d3ea" stroke-width="3"/>
    <path d="M478 258h12a10 10 0 0 1 0 20h-12" fill="none" stroke="#c9d3ea" stroke-width="3"/>
    <path d="M444 236c4-8-4-12 0-20" stroke="#c9d3ea" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M462 236c4-8-4-12 0-20" stroke="#c9d3ea" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- notebook and pen -->
  <g>
    <rect x="52" y="252" width="86" height="34" rx="6" fill="#ffd9a8" stroke="#e0b678" stroke-width="2" transform="rotate(-6 95 269)"/>
    <line x1="66" y1="262" x2="126" y2="256" stroke="#e0b678" stroke-width="2"/>
    <line x1="68" y1="272" x2="128" y2="266" stroke="#e0b678" stroke-width="2"/>
    <rect x="30" y="272" width="52" height="8" rx="4" fill="#7a4dff" transform="rotate(-14 56 276)"/>
  </g>

  <!-- sticky note -->
  <g transform="rotate(8 500 200)">
    <rect x="484" y="176" width="52" height="52" rx="4" fill="#fff3bf" stroke="#e6d68a" stroke-width="2"/>
    <line x1="494" y1="196" x2="526" y2="196" stroke="#c9b871" stroke-width="3"/>
    <line x1="494" y1="208" x2="520" y2="208" stroke="#c9b871" stroke-width="3"/>
  </g>
</svg>
