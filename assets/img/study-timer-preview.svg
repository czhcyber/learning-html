<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="study-timer-title">
  <title id="study-timer-title">Preview of the Study Timer: a Pomodoro timer with dark theme</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#bg)"/>

  <g transform="translate(40, 30)">
    <rect width="400" height="240" rx="24" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Title -->
    <text x="200" y="45" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', sans-serif"
          font-size="26" font-weight="700" fill="url(#timerGrad)">🍅 Study Timer</text>

    <!-- Mode tabs -->
    <rect x="60" y="65" width="90" height="32" rx="16" fill="rgba(255,107,107,0.15)"/>
    <text x="105" y="86" text-anchor="middle" font-family="sans-serif"
          font-size="12" font-weight="600" fill="#ff6b6b">🎯 专注</text>

    <rect x="158" y="65" width="84" height="32" rx="16" fill="rgba(255,255,255,0.05)"/>
    <text x="200" y="86" text-anchor="middle" font-family="sans-serif"
          font-size="12" font-weight="600" fill="rgba(255,255,255,0.6)">☕ 休息</text>

    <rect x="250" y="65" width="90" height="32" rx="16" fill="rgba(255,255,255,0.05)"/>
    <text x="295" y="86" text-anchor="middle" font-family="sans-serif"
          font-size="12" font-weight="600" fill="rgba(255,255,255,0.6)">🌴 长休息</text>

    <!-- Progress ring -->
    <g transform="translate(140, 160)">
      <circle r="58" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
      <path d="M0 -58 A58 58 0 1 1 -41 41" fill="none" stroke="url(#timerGrad)"
            stroke-width="12" stroke-linecap="round"/>
      <circle r="42" fill="rgba(26,26,46,0.95)"/>

      <!-- Time display -->
      <text x="0" y="-5" text-anchor="middle" font-family="'Segoe UI', sans-serif"
            font-size="36" font-weight="700" fill="#ffffff">25:00</text>
      <text x="0" y="18" text-anchor="middle" font-family="sans-serif"
            font-size="11" fill="rgba(255,255,255,0.5)">专注中...</text>
    </g>

    <!-- Control buttons -->
    <g transform="translate(230, 130)">
      <rect x="0" y="0" width="80" height="34" rx="17" fill="url(#timerGrad)"/>
      <path d="M28 11v12l14-6-14-6Z" fill="#fff"/>

      <rect x="88" y="4" width="56" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <path d="M110 12v10M116 12v10" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Stats section -->
    <g transform="translate(50, 210)">
      <rect x="0" y="0" width="90" height="18" rx="9" fill="rgba(255,255,255,0.05)"/>
      <text x="45" y="13" text-anchor="middle" font-family="sans-serif"
            font-size="10" fill="#feca57">📊 12 番茄</text>

      <rect x="100" y="0" width="100" height="18" rx="9" fill="rgba(255,255,255,0.05)"/>
      <text x="150" y="13" text-anchor="middle" font-family="sans-serif"
            font-size="10" fill="#feca57">⏱️ 300分钟</text>

      <rect x="210" y="0" width="90" height="18" rx="9" fill="rgba(255,255,255,0.05)"/>
      <text x="255" y="13" text-anchor="middle" font-family="sans-serif"
            font-size="10" fill="#feca57">🔥 7天连续</text>
    </g>
  </g>
</svg>