<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer — Cui Zhongheng</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 16px;
        }

        .tab {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .tab.active {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        .tab.short-break.active {
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
        }

        .tab.long-break.active {
            background: rgba(69, 183, 209, 0.15);
            color: #45b7d1;
        }

        .timer-display {
            text-align: center;
            margin-bottom: 36px;
        }

        .progress-ring-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 24px;
        }

        .progress-ring {
            transform: rotate(-90deg);
            width: 260px;
            height: 260px;
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 10;
        }

        .bg-circle {
            stroke: rgba(255, 255, 255, 0.1);
        }

        .progress-circle {
            stroke: #ff6b6b;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .progress-circle.short-break {
            stroke: #4ecdc4;
        }

        .progress-circle.long-break {
            stroke: #45b7d1;
        }

        .time-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .time-value {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
        }

        .phase-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 107, 107, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-skip {
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            padding: 10px 18px;
            font-size: 13px;
        }

        .btn-skip:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #feca57;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .tasks-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .tasks-title {
            font-size: 16px;
            font-weight: 600;
        }

        .task-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            outline: none;
            transition: background 0.3s ease;
        }

        .task-input:focus {
            background: rgba(255, 255, 255, 0.12);
        }

        .task-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .add-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #ff6b6b;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background: #ee5a24;
        }

        .task-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
        }

        .checkbox.checked {
            background: #4ecdc4;
            border-color: #4ecdc4;
        }

        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .delete-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 6px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .task-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 32px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            min-width: 300px;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #feca57;
        }

        .notification p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .progress-ring-container {
                width: 220px;
                height: 220px;
            }

            .progress-ring {
                width: 220px;
                height: 220px;
            }

            .time-value {
                font-size: 52px;
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .stat-item {
                padding: 14px 10px;
            }

            .stat-value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="projects.html" class="back-link">← Back to Projects</a>
        <div class="card">
            <div class="header">
                <h1>🍅 Study Timer</h1>
                <p>番茄工作法 · 高效专注学习</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-mode="focus">🎯 专注 (25分钟)</button>
                <button class="tab short-break" data-mode="short">☕ 短休息 (5分钟)</button>
                <button class="tab long-break" data-mode="long">🌴 长休息 (15分钟)</button>
            </div>

            <div class="timer-display">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 260 260">
                        <circle class="bg-circle" cx="130" cy="130" r="120"></circle>
                        <circle class="progress-circle" cx="130" cy="130" r="120"
                                stroke-dasharray="753.98"
                                stroke-dashoffset="0"></circle>
                    </svg>
                    <div class="time-text">
                        <div class="time-value" id="timeDisplay">25:00</div>
                        <div class="phase-label" id="phaseLabel">准备开始专注</div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" id="startBtn">▶ 开始</button>
                    <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
                    <button class="btn btn-skip" id="skipBtn">跳过 →</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="sessionsCount">0</div>
                    <div class="stat-label">完成番茄数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalTime">0分钟</div>
                    <div class="stat-label">总专注时长</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="streakDays">0天</div>
                    <div class="stat-label">连续天数</div>
                </div>
            </div>

            <div class="tasks-section">
                <div class="tasks-header">
                    <h3 class="tasks-title">📋 今日任务清单</h3>
                </div>
                <div class="task-input-container">
                    <input type="text" class="task-input" id="taskInput"
                           placeholder="添加新的学习任务..." maxlength="80">
                    <button class="add-btn" id="addTaskBtn">+ 添加</button>
                </div>
                <ul class="task-list" id="taskList">
                    <li class="empty-state">还没有任务，开始添加吧 ✨</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <h3 id="notifTitle"></h3>
        <p id="notifMessage"></p>
    </div>

    <script>
        (function() {
            const CIRCUMFERENCE = 753.98;

            const MODES = {
                focus: { time: 25 * 60, label: '专注中', color: '#ff6b6b' },
                short: { time: 5 * 60, label: '短休息', color: '#4ecdc4' },
                long: { time: 15 * 60, label: '长休息', color: '#45b7d1' }
            };

            let currentMode = 'focus';
            let timeLeft = MODES.focus.time;
            let totalTime = MODES.focus.time;
            let isRunning = false;
            let intervalId = null;

            let sessions = parseInt(localStorage.getItem('studyTimer_sessions') || '0');
            let totalMinutes = parseInt(localStorage.getItem('studyTimer_totalMinutes') || '0');
            let lastStudyDate = localStorage.getItem('studyTimer_lastDate') || '';
            let streak = parseInt(localStorage.getItem('studyTimer_streak') || '0');
            let tasks = JSON.parse(localStorage.getItem('studyTimer_tasks') || '[]');

            const timeDisplay = document.getElementById('timeDisplay');
            const phaseLabel = document.getElementById('phaseLabel');
            const progressCircle = document.querySelector('.progress-circle');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const skipBtn = document.getElementById('skipBtn');
            const sessionsCount = document.getElementById('sessionsCount');
            const totalTimeEl = document.getElementById('totalTime');
            const streakDays = document.getElementById('streakDays');
            const taskInput = document.getElementById('taskInput');
            const addTaskBtn = document.getElementById('addTaskBtn');
            const taskList = document.getElementById('taskList');
            const notification = document.getElementById('notification');
            const notifTitle = document.getElementById('notifTitle');
            const notifMessage = document.getElementById('notifMessage');

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function updateProgress() {
                const progress = timeLeft / totalTime;
                const offset = CIRCUMFERENCE * (1 - progress);
                progressCircle.style.strokeDashoffset = offset;

                progressCircle.classList.remove('short-break', 'long-break');
                if (currentMode === 'short') progressCircle.classList.add('short-break');
                if (currentMode === 'long') progressCircle.classList.add('long-break');
            }

            function updateDisplay() {
                timeDisplay.textContent = formatTime(timeLeft);
                updateProgress();
            }

            function updateStats() {
                sessionsCount.textContent = sessions;
                totalTimeEl.textContent = totalMinutes + '分钟';

                const today = new Date().toDateString();
                if (lastStudyDate && lastStudyDate !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    if (lastStudyDate === yesterday.toDateString()) {
                        streak++;
                    } else {
                        streak = 1;
                    }
                    localStorage.setItem('studyTimer_streak', streak);
                    localStorage.setItem('studyTimer_lastDate', today);
                } else if (!lastStudyDate) {
                    localStorage.setItem('studyTimer_lastDate', today);
                    streak = 1;
                    localStorage.setItem('studyTimer_streak', streak);
                }
                streakDays.textContent = streak + '天';
            }

            function showNotification(title, message) {
                notifTitle.textContent = title;
                notifMessage.textContent = message;
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 4000);
            }

            function switchMode(mode) {
                currentMode = mode;
                timeLeft = MODES[mode].time;
                totalTime = MODES[mode].time;
                isRunning = false;
                clearInterval(intervalId);
                startBtn.textContent = '▶ 开始';

                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

                phaseLabel.textContent = `准备开始${MODES[mode].label}`;
                updateDisplay();
            }

            function startTimer() {
                if (isRunning) {
                    isRunning = false;
                    clearInterval(intervalId);
                    startBtn.textContent = '▶ 开始';
                    phaseLabel.textContent = '已暂停';
                } else {
                    isRunning = true;
                    startBtn.textContent = '⏸ 暂停';
                    phaseLabel.textContent = MODES[currentMode].label + '中...';

                    intervalId = setInterval(() => {
                        timeLeft--;
                        updateDisplay();

                        if (timeLeft <= 0) {
                            clearInterval(intervalId);
                            isRunning = false;
                            startBtn.textContent = '▶ 开始';

                            if (currentMode === 'focus') {
                                sessions++;
                                totalMinutes += 25;
                                localStorage.setItem('studyTimer_sessions', sessions);
                                localStorage.setItem('studyTimer_totalMinutes', totalMinutes);
                                updateStats();
                                showNotification('🎉 专注完成！', '太棒了！休息一下吧~');
                                switchMode('short');
                            } else {
                                showNotification('☕ 休息结束', '准备好继续专注了吗？');
                                switchMode('focus');
                            }
                        }
                    }, 1000);
                }
            }

            function resetTimer() {
                isRunning = false;
                clearInterval(intervalId);
                timeLeft = MODES[currentMode].time;
                totalTime = MODES[currentMode].time;
                startBtn.textContent = '▶ 开始';
                phaseLabel.textContent = `准备开始${MODES[currentMode].label}`;
                updateDisplay();
            }

            function skipTimer() {
                if (currentMode === 'focus') {
                    switchMode('short');
                } else {
                    switchMode('focus');
                }
            }

            function renderTasks() {
                if (tasks.length === 0) {
                    taskList.innerHTML = '<li class="empty-state">还没有任务，开始添加吧 ✨</li>';
                    return;
                }

                taskList.innerHTML = tasks.map((task, index) => `
                    <li class="task-item">
                        <div class="checkbox ${task.completed ? 'checked' : ''}" data-index="${index}"></div>
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                        <button class="delete-btn" data-index="${index}">×</button>
                    </li>
                `).join('');

                document.querySelectorAll('.checkbox').forEach(checkbox => {
                    checkbox.addEventListener('click', () => {
                        const index = parseInt(checkbox.dataset.index);
                        tasks[index].completed = !tasks[index].completed;
                        localStorage.setItem('studyTimer_tasks', JSON.stringify(tasks));
                        renderTasks();
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const index = parseInt(btn.dataset.index);
                        tasks.splice(index, 1);
                        localStorage.setItem('studyTimer_tasks', JSON.stringify(tasks));
                        renderTasks();
                    });
                });
            }

            function addTask() {
                const text = taskInput.value.trim();
                if (!text) return;

                tasks.push({ text, completed: false });
                localStorage.setItem('studyTimer_tasks', JSON.stringify(tasks));
                taskInput.value = '';
                renderTasks();
            }

            startBtn.addEventListener('click', startTimer);
            resetBtn.addEventListener('click', resetTimer);
            skipBtn.addEventListener('click', skipTimer);

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    if (!isRunning) {
                        switchMode(tab.dataset.mode);
                    }
                });
            });

            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });

            updateDisplay();
            updateStats();
            renderTasks();
        })();
    </script>
</body>
</html>
