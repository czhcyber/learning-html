<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator — Cui Zhongheng</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .password-display {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .password-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            word-break: break-all;
            color: #4ecdc4;
            min-height: 32px;
            line-height: 1.4;
        }

        .password-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-copy {
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
        }

        .btn-copy:hover {
            background: rgba(78, 205, 196, 0.25);
            transform: translateY(-2px);
        }

        .btn-refresh {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }

        .btn-refresh:hover {
            background: rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }

        .options-section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.9);
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .option-row:last-child {
            border-bottom: none;
        }

        .option-label {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .toggle-switch.active::after {
            transform: translateX(24px);
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
        }

        .length-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
        }

        .length-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .length-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            min-width: 50px;
            text-align: right;
        }

        .strength-meter {
            margin-bottom: 28px;
        }

        .meter-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: all 0.4s ease;
        }

        .meter-fill.weak {
            width: 33%;
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
        }

        .meter-fill.medium {
            width: 66%;
            background: linear-gradient(90deg, #feca57, #f39c12);
        }

        .meter-fill.strong {
            width: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
        }

        .strength-text {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }

        .strength-text.weak { color: #ff6b6b; }
        .strength-text.medium { color: #feca57; }
        .strength-text.strong { color: #4ecdc4; }

        .generate-btn {
            width: 100%;
            padding: 18px 32px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(78, 205, 196, 0.3);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #4ecdc4;
            font-weight: 600;
            font-size: 15px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .password-text {
                font-size: 20px;
            }

            .action-btn {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="projects.html" class="back-link">← Back to Projects</a>
        <div class="card">
            <div class="header">
                <h1>🔐 Password Generator</h1>
                <p>Generate secure & random passwords instantly</p>
            </div>

            <div class="password-display">
                <div class="password-text" id="passwordText">Click Generate!</div>
                <div class="password-actions">
                    <button class="action-btn btn-copy" id="copyBtn">📋 Copy</button>
                    <button class="action-btn btn-refresh" id="refreshBtn">🔄 New</button>
                </div>
            </div>

            <div class="options-section">
                <h3 class="section-title">⚙️ Options</h3>

                <div class="length-control">
                    <span class="option-label">Password Length</span>
                    <input type="range" class="length-slider" id="lengthSlider"
                           min="6" max="64" value="16">
                    <span class="length-value" id="lengthValue">16</span>
                </div>

                <div class="option-row">
                    <span class="option-label">Uppercase (A-Z)</span>
                    <div class="toggle-switch active" data-option="uppercase"></div>
                </div>

                <div class="option-row">
                    <span class="option-label">Lowercase (a-z)</span>
                    <div class="toggle-switch active" data-option="lowercase"></div>
                </div>

                <div class="option-row">
                    <span class="option-label">Numbers (0-9)</span>
                    <div class="toggle-switch active" data-option="numbers"></div>
                </div>

                <div class="option-row">
                    <span class="option-label">Symbols (!@#$%)</span>
                    <div class="toggle-switch active" data-option="symbols"></div>
                </div>
            </div>

            <div class="strength-meter">
                <h3 class="section-title">💪 Strength</h3>
                <div class="meter-bar">
                    <div class="meter-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText">-</div>
            </div>

            <button class="generate-btn" id="generateBtn">✨ Generate Password</button>
        </div>
    </div>

    <div class="toast" id="toast">✓ Copied to clipboard!</div>

    <script>
        (function() {
            const CHARSETS = {
                uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                lowercase: 'abcdefghijklmnopqrstuvwxyz',
                numbers: '0123456789',
                symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
            };

            const options = {
                uppercase: true,
                lowercase: true,
                numbers: true,
                symbols: true
            };

            let passwordLength = 16;

            const passwordText = document.getElementById('passwordText');
            const lengthSlider = document.getElementById('lengthSlider');
            const lengthValue = document.getElementById('lengthValue');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const toast = document.getElementById('toast');

            function generatePassword() {
                let charset = '';
                let guaranteedChars = [];

                Object.keys(options).forEach(key => {
                    if (options[key]) {
                        charset += CHARSETS[key];
                        guaranteedChars.push(
                            CHARSETS[key][Math.floor(Math.random() * CHARSETS[key].length)]
                        );
                    }
                });

                if (charset === '') {
                    passwordText.textContent = 'Select at least one option!';
                    updateStrength('');
                    return '';
                }

                let password = [...guaranteedChars];

                for (let i = password.length; i < passwordLength; i++) {
                    password.push(charset[Math.floor(Math.random() * charset.length)]);
                }

                password = password.sort(() => Math.random() - 0.5).join('');

                passwordText.textContent = password;
                updateStrength(password);

                return password;
            }

            function updateStrength(password) {
                if (!password) {
                    strengthFill.className = 'meter-fill';
                    strengthText.className = 'strength-text';
                    strengthText.textContent = '-';
                    return;
                }

                let score = 0;

                if (password.length >= 12) score++;
                if (password.length >= 16) score++;
                if (/[a-z]/.test(password)) score++;
                if (/[A-Z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^a-zA-Z0-9]/.test(password)) score++;

                strengthFill.className = 'meter-fill';
                strengthText.className = 'strength-text';

                if (score <= 2) {
                    strengthFill.classList.add('weak');
                    strengthText.classList.add('weak');
                    strengthText.textContent = 'Weak 😰';
                } else if (score <= 4) {
                    strengthFill.classList.add('medium');
                    strengthText.classList.add('medium');
                    strengthText.textContent = 'Medium 👍';
                } else {
                    strengthFill.classList.add('strong');
                    strengthText.classList.add('strong');
                    strengthText.textContent = 'Strong 💪';
                }
            }

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }

            async function copyToClipboard() {
                const password = passwordText.textContent;
                if (password && !password.includes('Click') && !password.includes('Select')) {
                    try {
                        await navigator.clipboard.writeText(password);
                        showToast('✓ Copied to clipboard!');
                    } catch (err) {
                        showToast('❌ Failed to copy');
                    }
                }
            }

            lengthSlider.addEventListener('input', (e) => {
                passwordLength = parseInt(e.target.value);
                lengthValue.textContent = passwordLength;
            });

            document.querySelectorAll('.toggle-switch').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const option = toggle.dataset.option;
                    options[option] = !options[option];
                    toggle.classList.toggle('active', options[option]);
                });
            });

            generateBtn.addEventListener('click', generatePassword);
            refreshBtn.addEventListener('click', generatePassword);
            copyBtn.addEventListener('click', copyToClipboard);

            generatePassword();
        })();
    </script>
</body>
</html>
